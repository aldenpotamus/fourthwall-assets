<style>
    body {
        overflow-x: hidden;
    }

    .header {
        background-color: transparent !important;
    }

    #fw-section-announcement-bar {
        anchor-name: --announcement-bar;
    }

    .backdrop-crop {
        position: absolute;
        top: calc(var(--font-body-scale, 1) * 1.5rem + 32px);
        left: 0px;
        overflow: clip;
        height: 800px;
        width: 100%;
        z-index: -1;
    }

    @supports (top: anchor(bottom)) {
        .backdrop-crop {
            position-anchor: --announcement-bar;
            top: anchor(bottom);
        }
    }

    .background-svg {
        display: block;
        width: 100%;
        height: 100%;
        z-index: -1;
    }
    
    .hero-backdrop {
        opacity: 70%;
        position: absolute;
        top: 0px;
        left: 0px;
        width: 3000px;
        z-index: -1;
    }

    .dots {
        fill: url(#pattern7);
    }

    .gradient-container {
    }

    .gradient-container::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 5%; /* Gradient covers the bottom 5% */
        background-image: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0)); /* Gradient goes from 60% to 0% opacity */
    }
</style>
